<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>支付</title>
</head>

<body>

    <button onclick="goPay()">点击跳转</button>
    <div id="log"></div>


    <script>
        function goPay() {
            const url = "https://wx.tenpay.com/cgi-bin/mmpayweb-bin/checkmweb?prepay_id=wx222058352143417f03e9a93d1f68060000&package=4135282900";
            window.location.href = url;   // 当前页面跳转
        }
        function logToLabel(msg) {
            const el = document.getElementById('log');
            el.innerText += msg + '\n';
        }

        // 用法
        logToLabel('支付开始');
        // logToLabel(JSON.stringify(res, null, 2));
        /**
         * 检测当前是否运行在微信内置浏览器中
         */
        function detectWeChatBrowser() {
            // 确保 navigator 对象存在（避免特殊运行环境报错）
            if (typeof navigator === 'undefined') {
                console.warn('当前环境无 navigator 对象，无法检测浏览器类型');
                alert('无法检测浏览器类型');
                return;
            }

            // 使用 includes 替代 indexOf，语义更清晰（ES6 特性，现代浏览器均支持）
            const isWeChat = navigator.userAgent.includes('MicroMessenger');
            //若需支持 IE11 等不支持 includes的旧浏览器，可将 includes替换为 indexOf !== -1
            //const isWeChat = navigator.userAgent.indexOf('MicroMessenger') !== -1;

            // 三元表达式简化条件输出
            console.log(isWeChat ? '微信内置浏览器' : '外部浏览器');
            alert(isWeChat ? '微信内置浏览器' : '外部浏览器');
        }

        // 执行检测
        detectWeChatBrowser();
        function onBridgeReady() {
            logToLabel("WeixinJSBridge 已加载，开始支付...");
            const params = new URLSearchParams(window.location.search);

            const timeStamp = params.get('timeStamp');
            const nonceStr = params.get('nonceStr');
            const package = params.get('package');
            const paySign = params.get('paySign');

            console.log("timeStamp:", timeStamp);
            console.log("nonceStr:", nonceStr);
            console.log("package:", package);
            console.log("paySign:", paySign);

            WeixinJSBridge.invoke('getBrandWCPayRequest', {
                "appId": "wx2421b1c4370ec43b",     //公众号ID，由商户传入     
                "timeStamp": timeStamp,     //时间戳，自1970年以来的秒数     
                "nonceStr": nonceStr,      //随机串     
                "package": package,
                "signType": "RSA",     //微信签名方式：     
                "paySign": paySign //微信签名 
            },
                function (res) {
                    if (res.err_msg == "get_brand_wcpay_request:ok") {
                        logToLabel("支付成功");
                    } else if (res.err_msg == "get_brand_wcpay_request:cancel") {
                        logToLabel("用户取消支付");
                    } else {
                        logToLabel("支付失败" + res.err_msg);
                    }
                });
        }
        if (typeof WeixinJSBridge == "undefined") {
            logToLabel("WeixinJSBridge 未定义，等待加载...");
            alert("WeixinJSBridge 未定义，等待加载...");
            if (document.addEventListener) {
                alert("使用 addEventListener 监听 WeixinJSBridgeReady 事件");
                document.addEventListener('WeixinJSBridgeReady', onBridgeReady, false);
            } else if (document.attachEvent) {
                alert("使用 attachEvent 监听 WeixinJSBridgeReady 事件");
                document.attachEvent('WeixinJSBridgeReady', onBridgeReady);
                document.attachEvent('onWeixinJSBridgeReady', onBridgeReady);
            }
        } else {
            logToLabel("WeixinJSBridge 已定义，直接调用...");
            alert("WeixinJSBridge 已定义，直接调用...");
            onBridgeReady();
        }
    </script>

</body>

</html>
