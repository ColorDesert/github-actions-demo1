<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>支付</title>
</head>

<style>
    body {
        background: #f5f5f5;
        font-family: Arial;
    }

    /* 外层容器 */

    .box {
        margin: 100px 100px;
        /* 左右100px */
    }

    /* 卡片 */

    .card {
        background: #fff;
        border-radius: 20px;
        padding: 40px 30px 90px;
        text-align: center;
        position: relative;
    }

    .icon {
        width: 90px;
        margin: auto;
    }

    .icon img {
        width: 100%;
    }

    .title {
        font-size: 26px;
        margin: 15px 0 20px;
        color: #333;
    }

    .line {
        border-top: 1px dashed #ddd;
        margin: 20px 0;
    }

    .row {
        display: flex;
        justify-content: space-between;
        margin: 12px 0;
    }

    .label {
        color: #999;
    }

    .price {
        color: #ff8a00;
        font-size: 22px;
    }

    .order {
        color: #333;
        font-size: 14px;
    }

    /* 底部波浪 */

    .wave {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 40px;
    }
</style>

<body>
    <div id="log"></div>
    <div class="box">

        <div class="card">

            <div class="icon">
                <img src="wx.jpeg">
            </div>

            <div class="title">微信支付</div>

            <div class="line"></div>

            <div class="row">
                <div class="label">订单金额：</div>
                <div class="price">¥6.00</div>
            </div>

            <div class="row">
                <div class="label">订单编号：</div>
                <div class="order">SV202603051146536330394</div>
            </div>
            <div class="wave">
                <svg viewBox="0 0 120 28" preserveAspectRatio="none">
                    <path d="M0 20 Q10 0 20 20 T40 20 T60 20 T80 20 T100 20 T120 20 V30 H0 Z" fill="#f5f5f5" />
                </svg>
            </div>

        </div>

    </div>
    <script>
        function logToLabel(msg) {
            const el = document.getElementById('log');
            el.innerText += msg + '\n';
        }

        // 用法
        function onBridgeReady() {
            const params = new URLSearchParams(window.location.search);

            const timeStamp = params.get('timeStamp');
            const nonceStr = params.get('nonceStr');
            const package = params.get('package');
            const paySign = params.get('paySign');

            console.log("timeStamp:", timeStamp);
            console.log("nonceStr:", nonceStr);
            console.log("package:", package);
            console.log("paySign:", paySign);

            WeixinJSBridge.invoke('getBrandWCPayRequest', {
                "appId": "wx01445b5db95b6132",     //公众号ID，由商户传入     
                "timeStamp": timeStamp,     //时间戳，自1970年以来的秒数     
                "nonceStr": nonceStr,      //随机串     
                "package": package,
                "signType": "RSA",     //微信签名方式：     
                "paySign": paySign //微信签名 
            },
                function (res) {
                    if (res.err_msg == "get_brand_wcpay_request:ok") {
                        logToLabel("支付成功");
                    } else if (res.err_msg == "get_brand_wcpay_request:cancel") {
                        logToLabel("用户取消支付");
                    } else {
                        logToLabel("支付失败" + res.err_msg);
                    }
                });
        }
        if (typeof WeixinJSBridge == "undefined") {
            if (document.addEventListener) {
                document.addEventListener('WeixinJSBridgeReady', onBridgeReady, false);
            } else if (document.attachEvent) {
                document.attachEvent('WeixinJSBridgeReady', onBridgeReady);
                document.attachEvent('onWeixinJSBridgeReady', onBridgeReady);
            }
        } else {
            onBridgeReady();
        }
    </script>

</body>

</html>
