<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>支付</title>
</head>

<style>
    body {
        background: #f5f5f5;
        font-family: Arial;
    }

    /* 外层容器 */

    .box {
        margin: 0px;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* 卡片 */

    #card {
        background: #fff;
        width: calc(100% - 200px);
        border-radius: 20px;
        padding: 80px 50px 190px;
        text-align: center;
        position: relative;
    }

    .icon {
        width: 300px;
        margin: auto;
    }

    .icon img {
        width: 100%;
    }

    .title {
        font-size: 66px;
        margin: 15px 0 65px;
        color: #333;
    }

    .line {
        border-top: 5px dashed #ddd;
        margin: 20px 0;
    }

    .row {
        display: flex;
        justify-content: space-between;
        font-size: 40px;
        margin: 52px 0;
    }

    .label {
        color: #999;
    }


    #price {
        color: #ff8a00;
        font-size: 52px;
    }

    #order {
        color: #333;
        font-size: 44px;
    }
</style>

<body>
    <div class="box">

        <div id="card">

            <div class="icon">
                <img src="wx.jpeg">
            </div>

            <div class="title">微信支付</div>

            <div class="line"></div>

            <div class="row">
                <div class="label">订单金额：</div>
                <div id="price">¥6.00</div>
            </div>

            <div class="row">
                <div class="label">订单编号：</div>
                <div id="order">SV202603051146536330394</div>
            </div>
        </div>

    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        const orderId = params.get('orderId');
        const amount = params.get('amount');
        const cardElement = document.getElementById("card");
        document.getElementById("order").textContent = orderId;
        document.getElementById("price").textContent = "¥" + Number(amount).toFixed(2);
        //cardElement.style.display = "none";
        function onBridgeReady() {
            //const params = new URLSearchParams(window.location.search);

            const timeStamp = params.get('timeStamp');
            const nonceStr = params.get('nonceStr');
            const package = params.get('package');
            const paySign = params.get('paySign');

            WeixinJSBridge.invoke('getBrandWCPayRequest', {
                "appId": "wx01445b5db95b6132",     //公众号ID，由商户传入     
                "timeStamp": timeStamp,     //时间戳，自1970年以来的秒数     
                "nonceStr": nonceStr,      //随机串     
                "package": package,
                "signType": "RSA",     //微信签名方式：     
                "paySign": paySign //微信签名 
            },
                function (res) {
                    if (res.err_msg == "get_brand_wcpay_request:ok") {
                        console.log("支付成功");
                    } else if (res.err_msg == "get_brand_wcpay_request:cancel") {
                        console.log("用户取消支付");
                    } else {
                        console.log("支付失败" + res.err_msg);
                    }
                    cardElement.style.display = "block";
                });
        }
        if (typeof WeixinJSBridge == "undefined") {
            if (document.addEventListener) {
                document.addEventListener('WeixinJSBridgeReady', onBridgeReady, false);
            } else if (document.attachEvent) {
                document.attachEvent('WeixinJSBridgeReady', onBridgeReady);
                document.attachEvent('onWeixinJSBridgeReady', onBridgeReady);
            }
        } else {
            onBridgeReady();
        }
    </script>

</body>

</html>
